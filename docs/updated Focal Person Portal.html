  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();
              if (done) break;

              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-display: swap;\n  src: url(\"8878dd4f-acd7-4a2e-a5c2-5af4bb305dce\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box}\n  body{margin:0;background:#FAF6EF;font-family:'Public Sans',system-ui,sans-serif;color:#16241C;-webkit-font-smoothing:antialiased}\n  a{color:#8A5E14;text-decoration:none}\n  a:hover{color:#6E4A0F}\n  input,select,textarea,button{font-family:inherit}\n  ::selection{background:#F0DCAE}\n  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #D99A2C;outline-offset:2px}\n  @keyframes fpFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"min-height:100vh;display:flex;flex-wrap:wrap\">\n  <div style=\"flex:1 1 420px;background:#24402F;color:#fff;padding:clamp(30px,5vw,56px) clamp(22px,5vw,60px);display:flex;flex-direction:column;justify-content:space-between;gap:36px;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;top:-140px;right:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(217,154,44,.28),transparent 70%)\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;position:relative\">\n      <div style=\"width:52px;height:52px;border-radius:50%;background:#fff;color:#24402F;display:grid;place-items:center;font-family:'Outfit';font-weight:700;letter-spacing:.5px\">PM<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Outfit';font-size:24px;font-weight:700;line-height:1.1\">PMCC<\u002Fdiv>\n        <div style=\"font-size:13px;color:#B9CCBF\">Prime Minister's Contact Centre<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;max-width:460px\">\n      <div style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(217,154,44,.16);color:#E8B14A;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#E8B14A\"><\u002Fspan>Focal Person access\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Outfit';font-size:clamp(32px,4.4vw,52px);line-height:1.06;font-weight:700;color:#E8B14A;margin:22px 0 18px\">Sign in to your desk.<\u002Fh1>\n      <p style=\"font-size:17px;line-height:1.6;color:#C9D8CD;margin:0\">Complaints routed to your department are waiting. Acknowledge within 48 hours and resolve inside the 15-day service standard.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:14px;padding:16px 20px;font-size:14px;color:#C9D8CD;max-width:420px\">\n      <span style=\"color:#E8B14A\">🔒<\u002Fspan> Government-issued credentials only. Sessions expire after 30 minutes idle.\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1 1 380px;display:flex;align-items:center;justify-content:center;padding:clamp(30px,5vw,48px) clamp(20px,4vw,56px)\">\n    <div style=\"width:100%;max-width:420px;animation:fpFade .4s ease both\">\n      <sc-if value=\"{{ loginStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5F6E63;font-weight:600\">Step 1 of 2<\u002Fdiv>\n        <h2 style=\"font-family:'Outfit';font-size:34px;font-weight:600;margin:10px 0 8px;color:#24402F\">Officer login<\u002Fh2>\n        <p style=\"color:#6B7A70;margin:0 0 30px;line-height:1.6\">Use the PMCC account issued by your department.<\u002Fp>\n        <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:8px\">Official email or CNIC<\u002Flabel>\n        <input value=\"{{ loginId }}\" sc-camel-on-change=\"{{ setLoginId }}\" placeholder=\"focal.person@ajk.gov.pk\" style=\"width:100%;padding:16px 18px;border:1px solid #E2DACB;border-radius:14px;background:#FBF8F2;font-size:16px;margin-bottom:20px\">\n        <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:8px\">Password<\u002Flabel>\n        <input type=\"password\" value=\"{{ loginPw }}\" sc-camel-on-change=\"{{ setLoginPw }}\" placeholder=\"••••••••\" style=\"width:100%;padding:16px 18px;border:1px solid #E2DACB;border-radius:14px;background:#FBF8F2;font-size:16px;margin-bottom:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:28px\">\n          <label style=\"display:flex;align-items:center;gap:8px;color:#6B7A70\"><input type=\"checkbox\" style=\"accent-color:#24402F;width:16px;height:16px\">Keep me signed in<\u002Flabel>\n          <a href=\"#reset\">Forgot password?<\u002Fa>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goOtp }}\" style=\"width:100%;padding:17px;border:none;border-radius:999px;background:#EE3B23;color:#fff;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 10px 22px rgba(238,59,35,.26)\" style-hover=\"background:#D22F19\">Continue →<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ loginStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5F6E63;font-weight:600\">Step 2 of 2<\u002Fdiv>\n        <h2 style=\"font-family:'Outfit';font-size:34px;font-weight:600;margin:10px 0 8px;color:#24402F\">Verify it's you<\u002Fh2>\n        <p style=\"color:#6B7A70;margin:0 0 30px;line-height:1.6\">We sent a 6-digit code to the mobile registered with this account, ending \n          <strong style=\"color:#16241C\">••• 4417<\u002Fstrong>.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(5px,1.6vw,10px);margin-bottom:22px\">\n          <input maxlength=\ iv>\n              <\u002Fdiv>\n              <div style=\"text-align:right\">\n                <div style=\"font-family:'Outfit';font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:{{ c.tone }}\">{{ c.days }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#5F6E63\">days open<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:18px\">\n              <button sc-camel-on-click=\"{{ c.open }}\" style=\"border:none;border-radius:999px;background:#24402F;color:#fff;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#16281D\">Open complaint<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ c.escalate }}\" style=\"border:1px solid #D99A2C;border-radius:999px;background:transparent;color:#8A6314;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#FBF0DA\">Escalate to Admin<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ c.note }}\" style=\"border:1px solid #E2DACB;border-radius:999px;background:transparent;color:#5C6B60;padding:11px 20px;font-size:14px;font-weight:500;cursor:pointer\" style-hover=\"background:#F3EEE4\">Add progress note<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:1260px;animation:fpFade .3s ease both\">\n        <button sc-camel-on-click=\"{{ goList }}\" style=\"background:transparent;border:none;color:#5F6E63;font-size:14px;cursor:pointer;padding:0 0 14px\" style-hover=\"color:#16241C\">← Back to assigned complaints<\u002Fbutton>\n        <div style=\"background:#24402F;color:#fff;border-radius:20px;padding:clamp(20px,2.6vw,26px) clamp(20px,3vw,30px);margin-bottom:16px;position:relative;overflow:hidden\">\n          <div style=\"position:absolute;top:-120px;right:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(217,154,44,.22),transparent 70%)\"><\u002Fdiv>\n          <div style=\"position:relative;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start\">\n            <div style=\"min-width:0;flex:1\">\n              <div style=\"display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap\">\n                <span style=\"background:rgba(217,154,44,.18);color:#E8B14A;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums\">{{ d.id }}<\u002Fspan>\n                <span style=\"border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;font-size:13px\">{{ d.category }}<\u002Fspan>\n                <span style=\"border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;background:{{ d.tint }};color:{{ d.tone }}\">{{ d.status }}<\u002Fspan>\n                <sc-if value=\"{{ d.hasClubbed }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:#E8B14A\">{{ d.clubbedLabel }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <h1 style=\"font-family:'Outfit';font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.22;margin:0 0 12px;max-width:760px;text-wrap:pretty\">{{ d.title }}<\u002Fh1>\n              <div style=\"font-size:14px;color:#C9D8CD\">Lodged {{ d.lodged }} · {{ d.tehsil }} tehsil · {{ d.priority }} priority<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.07);border-radius:16px;padding:18px 22px;text-align:center;min-width:150px\">\n              <div style=\"font-size:12px;color:#C9D8CD;margin-bottom:6px\">Days open<\u002Fdiv>\n              <div style=\"font-family:'Outfit';font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:{{ d.slaTone }}\">{{ d.days }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#C9D8CD;margin-top:6px\">{{ d.slaNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n          <div style=\"flex:2 1 440px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n\n            <sc-if value=\"{{ d.hasDup }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#FBF0DA;border:1px solid #EBD5A6;border-radius:20px;padding:22px 24px\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px\">\n                <span style=\"display:inline-flex;align-items:center;gap:7px;background:#F3E2BC;color:#7A5A18;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase\">AI suggestion<\u002Fspan>\n                <span style=\"font-size:13px;color:#7A5A18;font-variant-numeric:tabular-nums\">{{ d.dupScore }} similarity<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family:'Outfit';font-size:19px;font-weight:600;color:#24402F;margin:0 0 6px\">This may be a duplicate<\u002Fh2>\n              <p style=\"margin:0 0 16px;font-size:14.5px;line-height:1.6;color:#6B5A2E\">Nothing is linked until you confirm it. Dismissing keeps both complaints separate and removes the suggestion.<\u002Fp>\n              <div style=\"background:#fff;border:1px solid #EBD5A6;border-radius:14px;padding:16px 18px;margin-bottom:16px\">\n                <div style=\"font-size:12.5px;color:#5F6E63;font-variant-numeric:tabular-nums;margin-bottom:5px\">{{ d.dupId }} · lodged {{ d.dupLodged }} · {{ d.dupStatus }}<\u002Fdiv>\n                <div style=\"font-weight:600;font-size:15px;margin-bottom:4px;text-wrap:pretty\">{{ d.dupTitle }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#5C6B60\">Lodged by {{ d.dupCitizen }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ openDuplicate }}\" style=\"border:none;border-radius:999px;background:#24402F;color:#fff;padding:12px 22px;font-size:14.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#16281D\">Confirm as duplicate<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ dismissDup }}\" style=\"border:1px solid #C8901F;border-radius:999px;background:transparent;color:#8A6314;padding:12px 22px;font-size:14.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#F5E4BE\">Dismiss suggestion<\u002Fbutton>\n                <button style=\"border:none;border-radius:999px;background:transparent;color:#8A5E14;padding:12px 14px;font-size:14.5px;font-weight:600;cursor:pointer\" style-hover=\"color:#6E4A0F\">Compare side by side<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"background:#fff;border:1px solid #EAE3D6;border-radius:20px;padding:24px 26px\">\n              <h2 style=\"font-family:'Outfit';font-size:19px;font-weight:600;color:#24402F;margin:0 0 12px\">What the citizen reported<\u002Fh2>\n              <p style=\"margin:0 0 18px;font-size:15px;line-height:1.7;color:#33413A\">{{ d.desc }}<\u002Fp>\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n                <div style=\"flex:1 1 118px;max-width:170px;height:96px;border-radius:12px;background:#F0EDE4;border:1px solid #E5DED0;display:grid;place-items:center;font-size:12px;color:#5F6E63\">Photo 1<\u002Fdiv>\n                <div style=\"flex:1 1 118px;max-width:170px;height:96px;border-radius:12px;background:#F0EDE4;border:1px solid #E5DED0;display:grid;place-items:center;font-size:12px;color:#5F6E63\">Photo 2<\u002Fdiv>\n                <div style=\"flex:1 1 118px;max-width:170px;height:96px;border-radius:12px;background:#F0EDE4;border:1px solid #E5DED0;display:grid;place-items:center;font-size:12px;color:#5F6E63\">Location pin<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #EAE3D6;border-radius:20px;padding:24px 26px\">\n              <h2 style=\"font-family:'Outfit';font-size:19px;font-weight:600;color:#24402F;margin:0 0 4px\">First investigation<\u002Fh2>\n              <p style=\"margin:0 0 18px;font-size:14.5px;color:#5C6B60\">Choose one path. Each writes a different record against this complaint.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:20px\">\n                <sc-for list=\"{{ paths }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ p.pick }}\" style=\"display:flex;gap:13px;align-items:flex-start;text-align:left;border:1px solid {{ p.border }};background:{{ p.bg }};border-radius:15px;padding:15px 17px;cursor:pointer;width:100%\" style-hover=\"border-color:#D99A2C\">\n                    <span style=\"width:20px;height:20px;flex:none;margin-top:2px;border-radius:50%;border:2px solid {{ p.dot }};display:grid;place-items:center\">\n                      <span style=\"width:9px;height:9px;border-radius:50%;background:{{ p.fill }};display:block\"><\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"min-width:0\">\n                      <span style=\"display:block;font-weight:600;font-size:15.4px;color:#16241C;margin-bottom:3px\">{{ p.label }}<\u002Fspan>\n                      <span style=\"display:block;font-size:13.6px;line-height:1.55;color:#5C6B60\">{{ p.hint }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ pathHandle }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"border-top:1px solid #F0EBE1;padding-top:20px\">\n                <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:9px\">Outcome<\u002Flabel>\n                <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px\">\n                  <sc-for list=\"{{ outcomes }}\" as=\"o\" hint-placeholder-count=\"2\">\n                    <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"border-color:#D99A2C\">{{ o.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:9px\">\n                  <label style=\"font-weight:600;font-size:15px\">Resolution summary for the citizen <span style=\"color:#A32A17\">*<\u002Fspan><\u002Flabel>\n                  <span style=\"font-size:13px;font-variant-numeric:tabular-nums;color:{{ summaryTone }}\">{{ summaryCount }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:0 0 10px;font-size:13.6px;line-height:1.55;color:#5C6B60\">The citizen reads this exact text on their public tracker. Plain language, no internal codes or abbreviations. Minimum 100 characters.<\u002Fp>\n                <textarea value=\"{{ summary }}\" sc-camel-on-change=\"{{ setSummary }}\" rows=\"4\" placeholder=\"What was found, what was done, and what the citizen can expect next.\" style=\"width:100%;padding:14px 16px;border:1px solid {{ summaryBorder }};border-radius:14px;background:#FBF8F2;font-size:15px;line-height:1.6;resize:vertical;margin-bottom:16px\"><\u002Ftextarea>\n                <div style=\"border:1px dashed #D9CFBB;border-radius:14px;padding:20px;text-align:center;color:#5F6E63;font-size:14px;margin-bottom:18px\">Attach resolution evidence — photos, work order, completion certificate<br><span style=\"font-size:13px\">JPG or PDF, up to 10 MB each<\u002Fspan><\u002Fdiv>\n                <sc-if value=\"{{ summaryShort }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;gap:9px;align-items:flex-start;background:#FDEAE6;border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:13.8px;line-height:1.55;color:#A32A17;font-weight:500\">\n                  <span style=\"flex:none;font-weight:700\">!<\u002Fspan>{{ summaryError }}\n                <\u002Fdiv>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ submitResolution }}\" disabled=\"{{ submitDisabled }}\" style=\"border:none;border-radius:999px;background:{{ submitBg }};color:{{ submitFg }};padding:14px 26px;font-size:15px;font-weight:600;cursor:{{ submitCursor }}\">{{ submitLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ pathClub }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid #F0EBE1;padding-top:20px\">\n                <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:9px\">Parent complaint<\u002Flabel>\n                <input placeholder=\"Search by reference, citizen or keyword\" style=\"width:100%;padding:14px 16px;border:1px solid #E2DACB;border-radius:14px;background:#FBF8F2;font-size:15px;margin-bottom:14px\">\n                <sc-for list=\"{{ clubCandidates }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;gap:13px;align-items:center;border:1px solid #EFE9DC;border-radius:14px;padding:14px 16px;margin-bottom:10px\">\n                    <span style=\"width:18px;height:18px;flex:none;border-radius:50%;border:2px solid #C2CBC3\"><\u002Fspan>\n                    <span style=\"flex:1;min-width:0\">\n                      <span style=\"display:block;font-weight:600;font-size:14.6px;text-wrap:pretty\">{{ c.title }}<\u002Fspan>\n                      <span style=\"display:block;font-size:12.5px;color:#5F6E63;font-variant-numeric:tabular-nums;margin-top:3px\">{{ c.id }} · {{ c.citizen }} · {{ c.status }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <p style=\"margin:12px 0 16px;font-size:13.6px;line-height:1.55;color:#5C6B60\">This complaint will follow the parent's progress on the citizen's tracker. You will be asked to confirm before the link is created.<\u002Fp>\n                <button sc-camel-on-click=\"{{ openDuplicate }}\" style=\"border:none;border-radius:999px;background:#24402F;color:#fff;padding:14px 26px;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:#16281D\">Club with selected complaint<\u002Fbutton>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ pathForward }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid #F0EBE1;padding-top:20px\">\n                <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:9px\">External body<\u002Flabel>\n                <sc-raw-select style=\"width:100%;padding:14px 16px;border:1px solid #E2DACB;border-radius:14px;background:#FBF8F2;font-size:15px;margin-bottom:16px\">\n                  <option>WAPDA — Muzaffarabad circle<\u002Foption>\n                  <option>SNGPL — regional office<\u002Foption>\n                  <option>NHA — Muzaffarabad section<\u002Foption>\n                  <option>Cantonment Board<\u002Foption>\n                  <option>Other (specify in the note)<\u002Foption>\n                <\u002Fsc-raw-select>\n                <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:9px\">Letter or reference number<\u002Flabel>\n                <input placeholder=\"e.g. PWD/MZD/2026/318\" style=\"width:100%;padding:14px 16px;border:1px solid #E2DACB;border-radius:14px;background:#FBF8F2;font-size:15px;margin-bottom:16px\">\n                <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:9px\">Why it sits outside the department <span style=\"color:#A32A17\">*<\u002Fspan><\u002Flabel>\n                <textarea rows=\"3\" placeholder=\"Recorded in the audit trail and summarised for the citizen.\" style=\"width:100%;padding:14px 16px;border:1px solid #E2DACB;border-radius:14px;background:#FBF8F2;font-size:15px;line-height:1.6;resize:vertical;margin-bottom:18px\"><\u002Ftextarea>\n                <button sc-camel-on-click=\"{{ openForwardModal }}\" style=\"border:none;border-radius:999px;background:#24402F;color:#fff;padding:14px 26px;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:#16281D\">Record external referral<\u002Fbutton>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ pathVisit }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid #F0EBE1;padding-top:20px\">\n                <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:9px\">Assign the visit to<\u002Flabel>\n                <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px\">\n                  <sc-for list=\"{{ assignees }}\" as=\"a\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ a.pick }}\" style=\"display:flex;gap:12px;align-items:center;text-align:left;border:1px solid {{ a.border }};background:{{ a.bg }};border-radius:14px;padding:13px 16px;cursor:pointer;width:100%\" style-hover=\"border-color:#D99A2C\">\n                      <span style=\"width:34px;height:34px;flex:none;border-radius:50%;background:#F0E6D2;color:#8A6314;display:grid;place-items:center;font-weight:700;font-size:12px\">{{ a.initials }}<\u002Fspan>\n                      <span style=\"flex:1;min-width:0\">\n                        <span style=\"display:block;font-weight:600;font-size:14.6px\">{{ a.name }}<\u002Fspan>\n                        <span style=\"display:block;font-size:12.5px;color:#5F6E63\">{{ a.meta }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span style=\"flex:none;font-size:12.5px;font-weight:600;color:{{ a.tone }}\">{{ a.state }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <p style=\"margin:0 0 16px;font-size:13.4px;color:#5C6B60\">Only field officers you supervise appear here.<\u002Fp>\n                <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:9px\">Target date<\u002Flabel>\n                <input type=\"date\" value=\"2026-09-15\" style=\"width:100%;padding:14px 16px;border:1px solid #E2DACB;border-radius:14px;background:#FBF8F2;font-size:15px;margin-bottom:16px\">\n                <label style=\"display:block;font-weight:600;font-size:15px;margin-bottom:9px\">What to check on site<\u002Flabel>\n                <textarea rows=\"3\" placeholder=\"Specific findings, measurements or photographs the officer should return with.\" style=\"width:100%;padding:14px 16px;border:1px solid #E2DACB;border-radius:14px;background:#FBF8F2;font-size:15px;line-height:1.6;resize:vertical;margin-bottom:18px\"><\u002Ftextarea>\n                <button sc-camel-on-click=\"{{ openVisitModal }}\" style=\"border:none;border-radius:999px;background:#24402F;color:#fff;padding:14px 26px;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:#16281D\">Schedule field visit<\u002Fbutton>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ d.hasVisit }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #EAE3D6;border-radius:20px;padding:24px 26px\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:4px\">\n                <h2 style=\"font-family:'Outfit';font-size:19px;font-weight:600;color:#24402F;margin:0\">Field visit findings<\u002Fh2>\n                <span
